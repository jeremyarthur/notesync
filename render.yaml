# Postgres persistente (el plan free de Render borra el disco local en cada
# deploy/spin-down, asi que SQLite no sirve para produccion).
databases:
  - name: notesync
    plan: free

# Render Blueprint de NoteSync: API (FastAPI) + frontend (React PWA estatico).
# Despliegue: Render -> New -> Blueprint -> selecciona el repo jeremyarthur/notesync.
services:
  - type: web
    name: notesync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: IOS_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notesync
          property: connectionString
      # Permite que el frontend desplegado pueda llamar a la API.
      - key: CORS_ORIGINS
        fromService:
          name: notesync-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: notesync-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: /editor, /nota/:id ... sirven index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    envVars:
      # Se injerta al construir: las llamadas van a https://notesync-api.onrender.com/api
      - key: VITE_API_BASE
        fromService:
          name: notesync-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL