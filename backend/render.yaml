services:
  - type: web
    name: notesync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IOS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"